name: Dependency audit

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: dependency audit (report only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pinned Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: 0.7.20
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            backend/pyproject.toml
            edge/pyproject.toml
            packages/*/pyproject.toml

      - name: Install pinned Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm with Corepack
        run: corepack enable

      - name: Read pinned pnpm version
        id: pnpm-version
        run: echo "version=$(node -p 'require("./frontend/package.json").packageManager.split("@")[1]')" >> "$GITHUB_OUTPUT"

      - name: Activate pinned pnpm
        run: corepack prepare "pnpm@${{ steps.pnpm-version.outputs.version }}" --activate

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm --dir frontend store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just@1.46.0

      - name: Run all ecosystem audits
        run: just audit

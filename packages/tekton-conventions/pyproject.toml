[project]
name = "tekton-conventions"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = ["tekton-conventions"]

[tool.uv.sources]
tekton-conventions = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH", "TID", "PLC0415"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.basedpyright]
typeCheckingMode = "strict"
include = ["src", "tests"]
failOnWarnings = true
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/tekton_conventions"]

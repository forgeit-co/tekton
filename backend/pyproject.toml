[project]
name = "tekton-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH", "TID", "PLC0415"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.hatch.build.targets.wheel]
packages = ["src/tekton"]

[tool.basedpyright]
typeCheckingMode = "strict"
include = ["src", "tests", "scripts"]
reportMissingTypeStubs = false
failOnWarnings = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_package = "tekton"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Backend layers"
type = "layers"
layers = ["tekton.presentation", "tekton.application", "tekton.domain", "tekton.kernel"]

[[tool.importlinter.contracts]]
name = "Domain and kernel import no frameworks"
type = "forbidden"
source_modules = ["tekton.domain", "tekton.kernel"]
forbidden_modules = ["fastapi", "sqlalchemy", "pydantic", "starlette", "httpx", "alembic"]

[[tool.importlinter.contracts]]
name = "Domain privacy follows its DAG row"
type = "forbidden"
source_modules = ["tekton.domain.privacy"]
forbidden_modules = ["tekton.domain.knowledge", "tekton.domain.sources", "tekton.domain.documents", "tekton.domain.fx", "tekton.domain.notifications", "tekton.domain.scheduling", "tekton.domain.decisions", "tekton.domain.proposals", "tekton.domain.approvals", "tekton.domain.sessions", "tekton.domain.runs", "tekton.domain.metering", "tekton.domain.mail", "tekton.domain.localities", "tekton.domain.plots", "tekton.domain.eligibility", "tekton.domain.budget", "tekton.domain.tasks", "tekton.domain.deadlines", "tekton.domain.projections", "tekton.domain.workflow", "tekton.application", "tekton.presentation", "tekton.infrastructure", "tekton.composition", "tekton.entrypoints"]


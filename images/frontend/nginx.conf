server_tokens off;

map $host $tekton_host_allowed {
    default 0;
    "127.0.0.1" 1;
    "localhost" 2;
}

map $http_host $tekton_redirect_port {
    default 8080;
    ~^localhost:(?<local_port>[0-9]+)$ $local_port;
}

server {
    listen 8080 default_server;
    server_name _;
    return 444;
}

server {
    listen 8080;
    server_name 127.0.0.1;
    if ($tekton_host_allowed = 0) { return 444; }

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; img-src 'self' data: blob:; worker-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    error_page 413 = @problem_413;
    error_page 502 504 = @problem_502;

    location = /api/v1/documents {
        client_max_body_size 51m;
        proxy_pass http://backend-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/v1/stream {
        proxy_pass http://backend-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /api/v1/runs/ {
        proxy_pass http://backend-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://backend-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location @problem_413 {
        default_type application/problem+json;
        return 413 '{"type":"about:blank","title":"Payload too large","status":413}';
    }
    location @problem_502 {
        default_type application/problem+json;
        return 502 '{"type":"about:blank","title":"Service unavailable","status":502}';
    }
}

server {
    listen 8080;
    server_name localhost;
    return 308 http://127.0.0.1:$tekton_redirect_port$request_uri;
}
